# docker-compose.prod.yml
#
# Production stack.
# Differences from docker-compose.yml (dev):
#   - All secrets from environment variables — no hardcoded values
#   - Images pre-built — no 'build:' directives
#   - restart: always on all services
#   - Health checks on all services with start_period
#   - No code volume mounts — code is baked into images
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d

x-airflow-common: &airflow-common
  # Image pre-built: docker build -t isr-airflow:latest .
  image: isr-airflow:latest
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    DATABASE_URL: ${DATABASE_URL}
  volumes:
    - ./dags:/opt/airflow/dags          # DAG files still mounted — easy to update
    - ./logs:/opt/airflow/logs
    - airflow_data:/opt/airflow/data
  depends_on:
    db:
      condition: service_healthy
    airflow-db:
      condition: service_healthy
  restart: always

services:
  # ── ISR data database ──────────────────────────────────────────
  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}', '-d', '${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  # ── Airflow metadata database ──────────────────────────────────
  airflow-db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB:       ${AIRFLOW_POSTGRES_DB}
      POSTGRES_USER:     ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${AIRFLOW_POSTGRES_USER}']
      interval: 10s
      retries: 5
      start_period: 10s
    restart: always

  # ── Airflow init (runs once then exits) ────────────────────────
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username ${AIRFLOW_ADMIN_USER}
          --password ${AIRFLOW_ADMIN_PASSWORD}
          --firstname Admin --lastname User
          --role Admin --email admin@example.com
      "
    restart: 'no'

  # ── Airflow webserver ──────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - '8080:8080'
    healthcheck:
      # Airflow takes time to initialise — start_period prevents false failures
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Airflow scheduler ──────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

volumes:
  postgres_data:
  airflow_db_data:
  airflow_data: