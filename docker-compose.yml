# docker-compose.yml
#
# Development stack.
# Uses .env for all secrets — no hardcoded values.
# Code mounted as volume for live reload (dev only).
# Dockerfile (Airflow) unchanged from Step 3.

x-airflow-common: &airflow-common
  build: .                          # uses ./Dockerfile for Airflow — unchanged
  image: isr-airflow:latest
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '30'
    DATABASE_URL: ${DATABASE_URL}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - .:/opt/airflow/project
  depends_on:
    airflow-db:
      condition: service_healthy
    db:
      condition: service_healthy

services:
  # ── ISR data database ──────────────────────────────────────────
  db:
    image: postgres:16
    container_name: isr_masters_db
    env_file: .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}', '-d', '${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Airflow metadata database ──────────────────────────────────
  airflow-db:
    image: postgres:16
    container_name: airflow_db
    env_file: .env
    environment:
      POSTGRES_DB:       ${AIRFLOW_POSTGRES_DB}
      POSTGRES_USER:     ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${AIRFLOW_POSTGRES_USER}']
      interval: 5s
      retries: 5

  # ── Airflow init (runs once then exits) ────────────────────────
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username ${AIRFLOW_ADMIN_USER}
          --password ${AIRFLOW_ADMIN_PASSWORD}
          --firstname Admin --lastname User
          --role Admin --email admin@example.com
      "
    restart: 'no'

  # ── Airflow webserver ──────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/health']
      interval: 10s
      retries: 5
    restart: always

  # ── Airflow scheduler ──────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

volumes:
  postgres_data:
  airflow_db_data: